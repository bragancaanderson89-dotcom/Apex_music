<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX Music · DEV</title>
<style>
@font-face{font-family:zsxMonTserrat;src:url('web/assets/zsx-montserrat.ttf')}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:zsxMonTserrat,Arial,sans-serif;color:#eee;background:#222}header{height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 25px;background:#121212;border-bottom:1px solid #ffffff20}h1{font-size:16px;margin:0;letter-spacing:-.5px}h1 span{font-size:8px;letter-spacing:1.4px;color:#aaa;border:1px solid #ffffff30;padding:4px 6px;border-radius:5px;margin-left:8px}p{margin:7px 0 0;color:#888;font-size:9px}nav{display:flex;gap:7px;align-items:center}button,select{font:inherit;cursor:pointer;font-size:10px;border:1px solid #ffffff22;background:#252525;color:#ddd;padding:10px 13px;border-radius:7px;white-space:nowrap}button:hover{background:#393939;color:#fff}button:focus-visible,select:focus-visible{outline:2px solid #eee;outline-offset:3px}button.primary{background:#eee;color:#151515;border-color:#eee}#stage{position:absolute;inset:70px 0 0;background:radial-gradient(ellipse at 60% 10%,#4c4c4c80,transparent 70%),linear-gradient(135deg,#272727,#161616)}#stage:before{content:'';position:absolute;inset:0;background-image:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:48px 48px;pointer-events:none}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}#file-note{position:absolute;z-index:4;bottom:12px;left:50%;transform:translateX(-50%);font-size:8px;color:#aaa;background:#141414e8;border:1px solid #ffffff18;padding:9px 14px;border-radius:7px;pointer-events:none;max-width:90vw;text-align:center}#file-note[hidden]{display:none}kbd{font:inherit;border:1px solid #ffffff25;padding:1px 4px;border-radius:3px}footer{position:absolute;right:18px;bottom:12px;pointer-events:none;font-size:8px;color:#5e5e5e}footer[hidden]{display:none}@media(max-width:800px){header{padding:0 13px;gap:10px;height:94px;flex-wrap:wrap;align-content:center}h1{font-size:13px}p{display:none}nav{gap:5px;flex-wrap:wrap}button,select{padding:8px 9px;font-size:8px}#stage{top:94px}#file-note{bottom:5px;font-size:7px;padding:7px 10px}footer{display:none}}
</style></head>
<body>
<header><div><h1>APEX Music <span>DEV</span></h1><p>Interface real do recurso · ESC fecha o menu e mantém a música.</p></div><nav aria-label="Controles de teste"><button id="dev-open">Abrir menu</button><select id="dev-provider" aria-label="Serviço da faixa demo"><option value="direct">Áudio direto</option><option value="youtube">YouTube</option><option value="spotify">Spotify</option></select><button id="dev-demo">Faixa demo</button><button id="dev-hud" class="primary">Testar disco</button><button id="dev-pause">Play / pausa</button><button id="dev-stop">Parar</button></nav></header>
<div id="stage"><iframe id="music" src="web/index.html?preview=1" title="Prévia do APEX Music" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe><div id="file-note" hidden>A demo funciona sem internet. Para testar áudio original, YouTube e Spotify, abra <kbd>START_DEV.cmd</kbd> e use a página HTTP local.</div><footer id="http-note">Ambiente de teste · sem conexão com o FiveM</footer></div>
<script>
(function(){'use strict';var frame=document.getElementById('music');
function send(data){frame.contentWindow.postMessage(data,location.protocol==='file:'?'*':location.origin)}
document.getElementById('dev-open').onclick=function(){send({action:'open'})};
document.getElementById('dev-demo').onclick=function(){send({action:'devDemo',provider:document.getElementById('dev-provider').value})};
document.getElementById('dev-hud').onclick=function(){send({action:'devHud',provider:document.getElementById('dev-provider').value})};
document.getElementById('dev-pause').onclick=function(){send({action:'control',control:'pause'})};
document.getElementById('dev-stop').onclick=function(){send({action:'control',control:'stop'})};
document.getElementById('file-note').hidden=location.protocol!=='file:';document.getElementById('http-note').hidden=location.protocol==='file:';
})();
</script></body></html>
